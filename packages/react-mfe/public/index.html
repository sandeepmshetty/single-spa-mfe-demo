<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React MFE - User Management</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        code {
            font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New',
                monospace;
        }
    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <% if (isLocal) { %>
    <!-- SystemJS Import Map -->
    <script type="systemjs-importmap">
    {
        "imports": {
            "react": "https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js",
            "react-dom": "https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js",
            "rxjs": "https://cdn.jsdelivr.net/npm/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js",
            "@single-spa-demo/shared-library": "http://localhost:9000/shared-library.js",
            "@single-spa-demo/react-mfe": "/react-mfe.js"
        }
    }
    </script>

    <!-- SystemJS -->
    <script src="https://cdn.jsdelivr.net/npm/systemjs@6.14.2/dist/system.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/systemjs@6.14.2/dist/extras/amd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/systemjs@6.14.2/dist/extras/named-exports.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/systemjs@6.14.2/dist/extras/named-register.min.js"></script>

    <script>
        System.import('@single-spa-demo/react-mfe').then(module => {
            const props = {
                name: '@single-spa-demo/react-mfe',
                singleSpa: true,
                mountParcel: () => {},
                domElement: document.getElementById('root'),
                basename: '/'
            };
            module.bootstrap(props).then(() => {
                module.mount(props);
            });
        }).catch(err => console.error(err));
    </script>
    <% } else { %>
    <script src="react-mfe.js"></script>
    <% } %>
</body>
</html>
